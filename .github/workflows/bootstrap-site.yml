name: Publicar CuántoMaterial
on:
  push:
    paths:
      - '.github/workflows/bootstrap-site.yml'
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar archivos del sitio
        shell: bash
        run: |
          cat <<'B64' | base64 -d > /tmp/cuantomaterial.tgz
          [... ELLIPSIZATION ...]
          B64
          mkdir -p /tmp/cm
          tar -xzf /tmp/cuantomaterial.tgz -C /tmp/cm
          cp -a /tmp/cm/cuantomaterial/. ./
          rm -f .github/workflows/bootstrap-site.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Web: publicar primera versión completa de CuántoMaterial'
          git push
